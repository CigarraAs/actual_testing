name: CI - Large Integration Tests

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  large-tests:
    name: Large Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install wait-on
        run: yarn add -D wait-on

      - name: Start sync-server in background
        run: |
          yarn workspace @actual-app/sync-server start &
          npx wait-on http://localhost:5006 --timeout 10000

      - name: Run large integration tests
        run: yarn workspace @actual-app/core test:large

      - name: Stop sync-server (cleanup)
        if: always()
        run: |
          pkill -f "node.*sync-server" || true